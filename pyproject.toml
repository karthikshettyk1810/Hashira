[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hashira"
version = "0.1.0.dev0"
description = "System Intelligence Runtime — an evidence-aware, time-aware model of a software system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["software-architecture", "code-intelligence", "system-graph", "mcp", "static-analysis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

# The core (src/hashira/core, src/hashira/ports) has no LLM SDK, no web
# framework and no database driver — enforced by tests/contract/test_core_purity.py.
# SQLAlchemy Core lives only in src/hashira/storage/sqlite, behind the ports.
# See docs/ARCHITECTURE.md, guardrail 7.
dependencies = [
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=2.0,<3"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "mcp>=2.0,<3",
]

[project.scripts]
hashira = "hashira.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hashira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# tests/fixtures holds fixture *repositories* indexed by our tests -- not
# tests themselves. Without this, its own tests/ subpackage collides on
# import with this project's top-level tests/ package (both would be
# imported as `tests.test_checkout`, etc).
norecursedirs = ["fixtures", ".venv", "*.egg-info", "build", "dist"]
markers = [
  "contract: locks a public contract; a failure means a schema version bump is required",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixture repositories are sample data indexed by tests, not code this
# project's style rules govern -- see pytest's matching `norecursedirs`.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/hashira"]
