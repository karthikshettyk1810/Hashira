[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hashira"
version = "0.1.0.dev0"
description = "System Intelligence Runtime — an evidence-aware, time-aware model of a software system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["software-architecture", "code-intelligence", "system-graph", "mcp", "static-analysis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

# The core has no LLM SDK, no web framework and no database driver.
# See docs/ARCHITECTURE.md, guardrail 7.
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
hashira = "hashira.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hashira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "contract: locks a public contract; a failure means a schema version bump is required",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/hashira"]
